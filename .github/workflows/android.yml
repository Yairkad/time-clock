name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0). Empty = build only'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          if [ -n "$INPUT_VERSION" ]; then V="${INPUT_VERSION#v}"; fi
          # A push whose package.json version has no release tag yet publishes that version.
          if [ -z "$V" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            PKG=$(node -p "require('./package.json').version")
            if ! git rev-parse -q --verify "refs/tags/v$PKG" >/dev/null; then V="$PKG"; fi
          fi
          if [ -n "$V" ]; then
            npm version "$V" --no-git-tag-version --allow-same-version
            echo "RELEASE_VERSION=$V" >> "$GITHUB_ENV"
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is missing - building a debug APK only"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/time-clock.apk"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/time-clock.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: time-clock-apk
          path: time-clock.apk

      - name: Fail release without signing key
        if: env.RELEASE_VERSION != '' && env.ANDROID_KEYSTORE_PATH == ''
        run: |
          echo "::error::Signing secrets are missing; refusing to publish an unsigned release"
          exit 1

      - name: Publish GitHub Release
        if: env.RELEASE_VERSION != '' && env.ANDROID_KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: שעון נוכחות ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: time-clock.apk
          generate_release_notes: true
